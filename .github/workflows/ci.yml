name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Local-only paths must not be in the pushed tree
        run: node scripts/check-push-scope.js --ref HEAD
      - name: Types
        run: npm run typecheck && npm run typecheck:scripts
      - name: Lint and formatting
        run: npm run lint && npm run lint:tools
      - name: Unused files and dependencies
        run: npm run knip
      - name: Locale parity and i18n audit
        run: npm run check:locales
      - name: Custom rules (comment slop, duplicate helpers)
        run: node scripts/lint-custom-rules.js
      - name: Ratchets (code, CSS, facade)
        run: npm run check:code-ratchet && npm run check:css-ratchet && npm run check:facade-usage
      - name: Version consistency
        run: node scripts/check-version-consistency.js
      - name: Build the release candidate
        run: npm run build:release
      - name: Verify the release bytes
        run: npm run release:verify
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            youtube.user.js
            youtube.user.min.js
            release-manifest.json

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Dependency advisories
        run: npm run security
      - name: Static security scans (innerHTML, secrets)
        run: node scripts/security-innerhtml-scan.js && node scripts/check-secrets.js

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [code-quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-assets
          path: dist
      - name: Verify tag and release bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.js verify --dir dist --tag "$RELEASE_TAG"
      - name: Publish verified GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes dist/youtube.user.js dist/youtube.user.min.js dist/release-manifest.json
